spring.application.name=service-desk

# Ortam degiskenleri .env dosyasindan okunur (dosya yoksa asagidaki
# varsayilanlar kullanilir). Sablon icin .env.example dosyasina bak.
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}

# PostgreSQL Baglantisi
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres?currentSchema=servicedesk}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}

# Sema
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:servicedesk}
spring.sql.init.mode=${SQL_INIT_MODE:always}

# Uygulama Ozel Parametreleri
app.service.currency=TRY
app.service.base-handling-fee=250.0
app.service.max-active-tickets-per-customer=3
